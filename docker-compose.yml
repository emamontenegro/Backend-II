services:

  # ── Vault (gestión de secretos) ────────────────────────────────────────────
  vault:
    image: hashicorp/vault:latest
    container_name: vault-backend
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN_ID}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    restart: unless-stopped

  # ── Prometheus (recolección de métricas) ───────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # extra_hosts es necesario en Linux para que host.docker.internal resuelva
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Grafana (visualización de métricas) ────────────────────────────────────
  # Puerto host 3001 → evita conflicto con la API Node.js en puerto 3000
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on:
      - prometheus
    restart: unless-stopped

# ── Volúmenes persistentes ──────────────────────────────────────────────────
# Nota: vault_data mapea el volumen pero Vault dev mode guarda en MEMORIA.
# Después de cada "docker compose up" correr: npm run seed:vault
volumes:
  vault_data:
  grafana_data:
