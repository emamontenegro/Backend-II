services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault-backend
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "blackskull17"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
    restart: unless-stopped

# Nota: el modo -dev de Vault almacena secretos en MEMORIA.
# El volumen está mapeado pero en dev mode no persiste al disco.
# Solución: después de cada "docker compose up", correr "npm run seed:vault"
# (el script tarda ~1 segundo y recarga todos los secretos automáticamente).
volumes:
  vault_data:
